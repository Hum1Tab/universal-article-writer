<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Universal Article Writer</title>
  <desc id="desc">Evidence-first writing for any AI. Sources, source ledger, claim-evidence matrix, red team, audit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="0.55" stop-color="#0d1729"/>
      <stop offset="1" stop-color="#111b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7dd3fc" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <circle cx="1120" cy="40" r="190" fill="#22d3ee" opacity="0.055"/>
  <circle cx="1180" cy="330" r="150" fill="#a78bfa" opacity="0.065"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#accent)"/>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <text x="64" y="68" fill="#67e8f9" font-size="15" font-weight="700" letter-spacing="3.2">OPEN PROTOCOL · MIT · WORKS WITH ANY AI</text>

    <text x="64" y="140" fill="#f8fafc" font-size="47" font-weight="800" letter-spacing="0.2">UNIVERSAL ARTICLE WRITER</text>
    <text x="64" y="188" fill="#c4b5fd" font-size="27" font-weight="600" font-family="'Yu Gothic', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif">論理記事工房</text>
    <text x="250" y="188" fill="#94a3b8" font-size="20" font-weight="400">Evidence-first writing for any AI</text>

    <text x="64" y="238" fill="#e2e8f0" font-size="21" font-weight="500">Fluent prose is not evidence.</text>
    <text x="64" y="270" fill="#94a3b8" font-size="18">Sources → ledger → claims → argument → red team → audit</text>

    <text x="64" y="318" fill="#67e8f9" font-size="17" font-weight="700" letter-spacing="0.6">STOP PROMPTING. START VERIFYING.</text>
  </g>

  <g transform="translate(760 82)">
    <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      <rect x="0" y="0" width="150" height="44" rx="10" fill="#0f2536" stroke="#22d3ee" stroke-opacity="0.55"/>
      <text x="75" y="27" fill="#a5f3fc">SOURCES</text>

      <rect x="0" y="66" width="150" height="44" rx="10" fill="#11203a" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="75" y="93" fill="#bae6fd">SOURCE LEDGER</text>

      <rect x="0" y="132" width="150" height="44" rx="10" fill="#171c3a" stroke="#818cf8" stroke-opacity="0.55"/>
      <text x="75" y="159" fill="#c7d2fe">CLAIM MATRIX</text>

      <rect x="0" y="198" width="150" height="44" rx="10" fill="#211a3a" stroke="#a78bfa" stroke-opacity="0.55"/>
      <text x="75" y="225" fill="#ddd6fe">RED TEAM</text>

      <rect x="186" y="132" width="150" height="44" rx="10" fill="#0f2b2a" stroke="#34d399" stroke-opacity="0.6"/>
      <text x="261" y="159" fill="#a7f3d0">AUDIT</text>

      <rect x="186" y="198" width="150" height="44" rx="10" fill="#0e2337" stroke="#fbbf24" stroke-opacity="0.55"/>
      <text x="261" y="225" fill="#fde68a">DOSSIER</text>
    </g>

    <g stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.85">
      <path d="M75 44 L75 66"/>
      <path d="M75 110 L75 132"/>
      <path d="M75 176 L75 198"/>
      <path d="M150 220 L186 170"/>
      <path d="M261 176 L261 198"/>
    </g>
    <g fill="#67e8f9">
      <circle cx="75" cy="55" r="3"/>
      <circle cx="75" cy="121" r="3"/>
      <circle cx="75" cy="187" r="3"/>
      <circle cx="168" cy="195" r="3"/>
      <circle cx="261" cy="187" r="3"/>
    </g>
  </g>
</svg>

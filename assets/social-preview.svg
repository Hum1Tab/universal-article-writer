<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Universal Article Writer — evidence-first writing for any AI</title>
  <desc id="desc">A portable protocol: sources, source ledger, claim-evidence matrix, argument map, red team, audit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c16"/>
      <stop offset="0.55" stop-color="#0c1526"/>
      <stop offset="1" stop-color="#121a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7dd3fc" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1100" cy="120" r="240" fill="#22d3ee" opacity="0.07" filter="url(#soft)"/>
  <circle cx="1120" cy="560" r="220" fill="#a78bfa" opacity="0.08" filter="url(#soft)"/>
  <rect x="0" y="0" width="1280" height="8" fill="url(#accent)"/>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <text x="80" y="96" fill="#67e8f9" font-size="18" font-weight="700" letter-spacing="4">OPEN PROTOCOL · MIT · ANY AI</text>

    <text x="80" y="194" fill="#f8fafc" font-size="76" font-weight="800" letter-spacing="-1">UNIVERSAL</text>
    <text x="80" y="272" fill="#f8fafc" font-size="76" font-weight="800" letter-spacing="-1">ARTICLE WRITER</text>

    <text x="82" y="330" fill="#c4b5fd" font-size="32" font-weight="600" font-family="'Yu Gothic', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif">論理記事工房</text>
    <text x="82" y="374" fill="#94a3b8" font-size="25">Evidence-first writing for any AI</text>

    <text x="82" y="442" fill="#e2e8f0" font-size="28" font-weight="500">Fluent prose is not evidence.</text>
    <text x="82" y="482" fill="#94a3b8" font-size="22">Source ledger · claim matrix · argument map · red team</text>

    <text x="82" y="552" fill="#67e8f9" font-size="23" font-weight="800" letter-spacing="1.2">STOP PROMPTING. START VERIFYING.</text>
    <text x="82" y="590" fill="#64748b" font-size="18">MIT · Works with any AI · No vendor lock-in</text>
  </g>

  <g transform="translate(800 120)" font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <g font-size="16" font-weight="700" text-anchor="middle">
      <rect x="0" y="0" width="170" height="50" rx="12" fill="#0f2536" stroke="#22d3ee" stroke-opacity="0.6"/>
      <text x="85" y="31" fill="#a5f3fc">SOURCES</text>

      <rect x="0" y="72" width="170" height="50" rx="12" fill="#11203a" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="85" y="103" fill="#bae6fd">SOURCE LEDGER</text>

      <rect x="0" y="144" width="170" height="50" rx="12" fill="#171c3a" stroke="#818cf8" stroke-opacity="0.6"/>
      <text x="85" y="175" fill="#c7d2fe">CLAIM MATRIX</text>

      <rect x="0" y="216" width="170" height="50" rx="12" fill="#211a3a" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="85" y="247" fill="#ddd6fe">RED TEAM</text>

      <rect x="210" y="144" width="170" height="50" rx="12" fill="#0f2b2a" stroke="#34d399" stroke-opacity="0.65"/>
      <text x="295" y="175" fill="#a7f3d0">AUDIT</text>

      <rect x="210" y="216" width="170" height="50" rx="12" fill="#0e2337" stroke="#fbbf24" stroke-opacity="0.6"/>
      <text x="295" y="247" fill="#fde68a">DOSSIER</text>
    </g>

    <g stroke="url(#accent)" stroke-width="2.5" fill="none" opacity="0.9">
      <path d="M85 50 L85 72"/>
      <path d="M85 122 L85 144"/>
      <path d="M85 194 L85 216"/>
      <path d="M170 241 L210 190"/>
      <path d="M295 194 L295 216"/>
    </g>
    <g fill="#67e8f9">
      <circle cx="85" cy="61" r="4"/>
      <circle cx="85" cy="133" r="4"/>
      <circle cx="85" cy="205" r="4"/>
      <circle cx="190" cy="216" r="4"/>
      <circle cx="295" cy="205" r="4"/>
    </g>
  </g>
</svg>
